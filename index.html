<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>ctxedit</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6f6b64; --line: #dedad2; --soft: #efede8;
  --accent: #1f5fbf; --danger: #b3261e; --ok: #1e7a46; --warn-bg: #fff4d6; --warn-ink: #6b4e00;
  --strike: #a09a90; --sugg: #b25e00; --sugg-bg: #fff1dc; --err-bg: #fde7e5;
  --k-user: #1f5fbf; --k-assistant: #c2571a; --k-tool_use: #7446b8; --k-tool_result: #0f7f7a;
  --k-thinking: #8a7f99; --k-summary: #a57a00; --k-other: #9a968e;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17171a; --panel: #202024; --ink: #e9e7e2; --muted: #9c988f; --line: #34343a; --soft: #2a2a2f;
    --accent: #7fb0ff; --danger: #ff8a80; --ok: #6fd39a; --warn-bg: #3d3212; --warn-ink: #f2d98a;
    --strike: #6d6a64; --sugg: #ffb65c; --sugg-bg: #3a2c15; --err-bg: #44201d;
    --k-user: #7fb0ff; --k-assistant: #f0935a; --k-tool_use: #b79cf0; --k-tool_result: #5fd0c9;
    --k-thinking: #a79dba; --k-summary: #e0b84a; --k-other: #7d7a73;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { button.primary { color: #10131a; } }
button.link { border: 0; background: none; padding: 0 2px; color: var(--accent); }
input[type=text], input[type=number], input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
input[type=number] { width: 5.5em; }
.muted { color: var(--muted); }
.hidden { display: none !important; }

header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .02em; }
.title { flex: 1 1 120px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.counter { font-variant-numeric: tabular-nums; white-space: nowrap; }
.counter b { font-weight: 650; }
.counter .saved { color: var(--ok); }
.bar2 { padding-top: 0; gap: 8px; }
.seg { display: inline-flex; white-space: nowrap; }
.seg button { border-radius: 0; }
.seg button + button { margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.detour { border: 1px solid var(--sugg); border-radius: 8px; background: var(--sugg-bg); padding: 10px 12px; margin: 14px 0 8px; }
.detour h4 { margin: 0 0 2px; font-size: 14px; color: var(--sugg); }
.detour .why { color: var(--ink); margin-bottom: 8px; }
.detour label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
.detour textarea { width: 100%; min-height: 74px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); resize: vertical; }
.detour .files { font-size: 12.5px; color: var(--muted); margin-top: 4px; word-break: break-all; }
.detour .ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12.5px; }
.detour .ctl button { padding: 1px 8px; font-size: 12.5px; }
.detour .ctl .grow { flex: 1; }
.card.in-detour { margin-left: 18px; border-right: 3px solid var(--sugg); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--panel); cursor: pointer; user-select: none; white-space: nowrap; }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.chip.off { opacity: .45; text-decoration: line-through; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
label.inline { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

main { max-width: 1060px; margin: 0 auto; padding: 14px 16px 120px; }
.banner { border-radius: 8px; padding: 9px 12px; margin: 0 0 10px; background: var(--warn-bg); color: var(--warn-ink); }
.banner.err { background: var(--err-bg); color: var(--danger); }
.banner.ok { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }
.banner code, .cmd code { font-family: var(--mono); }

/* picker */
.project { margin: 0 0 18px; }
.project h2 { font-size: 13px; font-weight: 650; margin: 0 0 6px; color: var(--muted); font-family: var(--mono); word-break: break-all; }
.project.here h2 { color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr 11em 6em 7.5em; gap: 12px; align-items: baseline; padding: 7px 12px; background: var(--panel); border: 1px solid var(--line); border-bottom-width: 0; cursor: pointer; }
.row:first-of-type { border-radius: 8px 8px 0 0; }
.row:last-of-type { border-bottom-width: 1px; border-radius: 0 0 8px 8px; }
.row:only-of-type { border-radius: 8px; }
.row:hover, .row:focus { outline: none; background: var(--soft); }
.row.sel { box-shadow: inset 3px 0 0 var(--accent); }
.row .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.rowhead { display: grid; grid-template-columns: 1fr 11em 6em 7.5em; gap: 12px; padding: 0 12px 4px; font-size: 12px; color: var(--muted); }
.rowhead span:nth-child(n+2) { text-align: right; }

/* groups */
details.group { margin: 0 0 12px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; }
details.group > summary { cursor: pointer; color: var(--muted); }
details.group[open] > summary { margin-bottom: 8px; }

/* cards */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--k); border-radius: 8px; margin: 0 0 6px; content-visibility: auto; contain-intrinsic-size: auto 78px; }
.card.k-user { --k: var(--k-user); } .card.k-assistant { --k: var(--k-assistant); }
.card.k-tool_use { --k: var(--k-tool_use); } .card.k-tool_result { --k: var(--k-tool_result); }
.card.k-thinking { --k: var(--k-thinking); } .card.k-summary { --k: var(--k-summary); } .card.k-other { --k: var(--k-other); }
.card.pair-top { margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.card.pair-bottom { border-top-left-radius: 0; border-top-right-radius: 0; border-top-style: dashed; }
.card.pairhover { box-shadow: 0 0 0 2px var(--k-tool_use); }
.card.sel-anchor { box-shadow: 0 0 0 2px var(--accent); }
.card.err { box-shadow: 0 0 0 2px var(--danger); background: var(--err-bg); }
.head { display: flex; align-items: center; gap: 8px; padding: 5px 8px 3px 10px; cursor: pointer; min-height: 30px; }
.num { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 2.6em; }
.label { font-weight: 650; color: var(--k); white-space: nowrap; }
.tool { font-family: var(--mono); font-size: 12.5px; }
.tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
.tag.edited { color: var(--accent); border-color: var(--accent); }
.tag.pair { cursor: pointer; }
.tag.locked { border-style: dashed; }
.meta { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.head button { padding: 1px 8px; font-size: 12.5px; }
.dropbtn { min-width: 5.6em; }
.body { padding: 0 10px 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.body.mono, .card.k-tool_use .body, .card.k-tool_result .body, .card.k-other .body { font-family: var(--mono); font-size: 12.5px; }
.body.collapsed { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-height: 4.5em; padding-bottom: 0; margin-bottom: 8px; cursor: pointer; }
.card.dropped { opacity: .55; background: var(--soft); }
.card.dropped .body, .card.dropped .label, .card.dropped .tool { text-decoration: line-through; text-decoration-color: var(--strike); color: var(--muted); }
.card.locked .head { cursor: pointer; }
.unit { cursor: pointer; border-radius: 3px; }
.unit:hover { background: var(--soft); box-shadow: 0 0 0 1px var(--line); }
.unit.x { text-decoration: line-through; color: var(--strike); background: none; }
.unit.code { display: block; font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 6px 8px; margin: 4px 0; }
.line { display: block; min-height: 1.45em; cursor: pointer; padding: 0 4px; border-radius: 2px; }
.line:hover { background: var(--soft); }
.line.x { text-decoration: line-through; color: var(--strike); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 10px 8px; font-size: 12.5px; color: var(--muted); }
.tools button { padding: 1px 8px; }
.tools input[type=number] { width: 4.5em; padding: 1px 6px; }
.editbox { padding: 0 10px 10px; }
.editbox textarea { width: 100%; min-height: 9em; resize: vertical; background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; padding: 8px; font-family: var(--mono); font-size: 12.5px; line-height: 1.45; }
.editbox .btns { display: flex; gap: 8px; margin-top: 6px; }
.sugg { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--sugg-bg); color: var(--sugg); border-top: 1px solid var(--line); border-radius: 0 0 6px 0; font-size: 13px; }
.sugg b { text-transform: uppercase; font-size: 11.5px; letter-spacing: .04em; }
.sugg .why { flex: 1; color: var(--ink); }
.sugg button { padding: 1px 8px; font-size: 12.5px; }
.sugg-new { padding: 6px 10px 8px; background: var(--sugg-bg); font-size: 12.5px; }
.sugg-new pre { margin: 4px 0 0; padding: 6px 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); background: var(--bg, transparent); border: 1px solid var(--line); border-radius: 4px; color: var(--ink); }
.line.sx, .unit.sx { background: var(--sugg-bg); text-decoration: line-through; text-decoration-color: var(--sugg); }
.card.has-sugg { border-color: var(--sugg); border-left-color: var(--k); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 16px; }

dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 18px 20px; max-width: 560px; width: calc(100% - 40px); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h3 { margin: 0 0 8px; font-size: 16px; }
dialog p { margin: 8px 0; }
dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.cmd { display: flex; gap: 8px; align-items: center; background: var(--soft); border-radius: 6px; padding: 8px 10px; margin: 10px 0; }
.cmd code { flex: 1; overflow-wrap: anywhere; user-select: all; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -1px; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">ctxedit</span>
    <button id="back" class="hidden" title="Back to the session list">← Sessions</button>
    <span id="title" class="title muted">Pick a session</span>
    <span id="counter" class="counter hidden"></span>
    <span id="editorButtons" class="hidden" style="display:flex;gap:8px;align-items:center">
      <span class="seg">
        <button id="suggest" title="A model marks steps that look safe to drop. It reads a preview of each step: the first 300 and last 100 characters.">Suggest cuts</button>
        <button id="suggestFull" title="The model reads the full text of every step. It can then say which lines or sentences to cut, or propose a short replacement for a tool result. Slower and uses more tokens.">full text</button>
        <button id="detours" title="A model reads an outline of the whole session and looks for detours: stretches where the work left the main task and came back later (yak shaving). It proposes removing each stretch and leaving a short note in its place.">Find detours</button>
      </span>
      <span id="suggBar" class="hidden" style="display:flex;gap:6px;align-items:center;white-space:nowrap">
        <span id="suggCount" style="color:var(--sugg)"></span>
        <button id="acceptAll">Accept all</button>
        <button id="dismissAll">Dismiss all</button>
      </span>
      <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button id="save" class="primary" title="Write a new session next to the original. The original is not changed.">Save as fork</button>
    </span>
  </div>
  <div id="bar2" class="bar bar2 hidden">
    <span id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    <input id="search" type="search" placeholder="Search steps…" style="flex:1 1 140px;min-width:120px">
    <span class="sep"></span>
    <label class="inline" title="Drop every tool result larger than this, together with its tool call">Drop results over
      <input id="bulkN" type="number" min="0" step="500" value="2000"> tok</label>
    <button id="bulk">Drop</button>
    <span class="sep"></span>
    <label class="inline" title="When part of a tool result is removed, leave this marker so the model knows the output is incomplete">
      <input id="marker" type="checkbox" checked> mark trims <code id="markerText"></code></label>
  </div>
</header>

<main>
  <div id="banners"></div>
  <section id="picker"></section>
  <section id="editor" class="hidden">
    <details id="gPre" class="group hidden"><summary></summary><div></div></details>
    <div id="gLive"></div>
    <div id="noMatch" class="empty hidden">No step matches the filter.</div>
    <details id="gBranch" class="group hidden"><summary></summary><div></div></details>
    <details id="gSide" class="group hidden"><summary></summary><div></div></details>
    <div id="foot" class="foot"></div>
  </section>
</main>

<dialog id="dlg"></dialog>

<script>
'use strict';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
const KINDS = ['user', 'assistant', 'tool_use', 'tool_result', 'thinking', 'summary', 'other'];
const LABEL = {user: 'You', assistant: 'Claude', tool_use: 'Tool call', tool_result: 'Tool result', thinking: 'Thinking', summary: 'Summary', other: 'Other'};
const MAX_UNITS = 4000;

let doc = null, meta = null, steps = [], byId = {}, views = {}, cards = {}, counters = null;
let expanded = new Set(), editing = new Set(), sugg = {}, offKinds = new Set(), searchIds = null;
let anchor = null, errSteps = new Set(), savedAt = -1, busy = false, detours = [];

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids) if (kid !== null && kid !== undefined && kid !== false) e.append(kid);
  return e;
}
async function api(name, body, params) {
  const qs = params ? '?' + new URLSearchParams(params) : '';
  let res;
  try {
    res = await fetch('/api/' + name + qs, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({'X-Ctxedit-Token': TOKEN}, body ? {'Content-Type': 'application/json'} : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) {
    throw new Error('The ctxedit server behind this tab is no longer running, so this tab is stale and nothing here can be saved. Start ctxedit again and use the new tab.');
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* fall through */ }
  if (!res.ok) throw new Error((data && data.error) || ('request failed: ' + res.status));
  return data;
}
function fill(parent, ...kids) { parent.replaceChildren(...kids.filter((k) => k !== null && k !== undefined && k !== false)); }
function tok(n) {
  if (n >= 100000) return Math.round(n / 1000) + 'k';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}
function when(ts) {
  if (!ts) return '';
  const d = new Date(typeof ts === 'number' ? ts * 1000 : ts);
  if (isNaN(d)) return '';
  return d.toLocaleString(undefined, {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: typeof ts === 'number' ? undefined : '2-digit'});
}
function ago(sec) {
  if (sec < 90) return 'just now';
  if (sec < 3600) return Math.round(sec / 60) + ' min ago';
  if (sec < 86400 * 2) return Math.round(sec / 3600) + ' h ago';
  return Math.round(sec / 86400) + ' days ago';
}
function banner(kind, ...content) {
  const b = el('div', {class: 'banner ' + (kind || '')}, ...content);
  $('banners').append(b);
  return b;
}
function fail(e) { banner('err', String(e.message || e)); window.scrollTo({top: 0}); }

/* ------------------------------------------------------------------ picker */
async function showPicker() {
  doc = null; meta = null;
  history.replaceState(null, '', location.pathname + location.search);
  $('banners').replaceChildren();
  $('editor').classList.add('hidden'); $('bar2').classList.add('hidden');
  $('counter').classList.add('hidden'); $('editorButtons').classList.add('hidden'); $('back').classList.add('hidden');
  $('title').textContent = 'Pick a session'; $('title').classList.add('muted');
  const box = $('picker'); box.classList.remove('hidden');
  box.replaceChildren(el('div', {class: 'empty'}, el('span', {class: 'spin'}), ' Reading sessions…'));
  let data;
  try { data = await api('sessions'); } catch (e) { box.replaceChildren(); return fail(e); }
  if (data.direct && !showPicker.openedDirect) { showPicker.openedDirect = true; return openSession(data.direct); }
  box.replaceChildren();
  if (!data.projects.length) {
    box.append(el('div', {class: 'empty', text: 'No sessions found under ' + data.root}));
    return;
  }
  const projects = data.projects.slice();
  const here = projects.findIndex((p) => p.dir === data.preselect);
  if (here > 0) projects.unshift(projects.splice(here, 1)[0]);
  const queue = [];
  let first = null;
  for (const p of projects) {
    const isHere = p.dir === data.preselect;
    const h = el('h2', {text: p.name + (isHere ? '  (this folder)' : '')});
    const sec = el('div', {class: 'project' + (isHere ? ' here' : '')}, h,
      el('div', {class: 'rowhead'}, el('span', {text: 'First prompt'}), el('span', {text: 'Last modified'}), el('span', {text: 'Steps'}), el('span', {text: 'Tokens (approx.)'})));
    for (const s of p.sessions) {
      const cells = {p: el('span', {class: 'p muted', text: '…'}), steps: el('span', {class: 'n', text: ''}), tok: el('span', {class: 'n', text: ''})};
      const row = el('div', {class: 'row', tabindex: '0', title: s.id,
        onclick: () => openSession(s.path),
        onkeydown: (ev) => { if (ev.key === 'Enter') openSession(s.path); }},
        cells.p, el('span', {class: 'n', title: when(s.mtime), text: ago(data.now - s.mtime)}), cells.steps, cells.tok);
      const fill = (sm) => {
        cells.p.textContent = sm.prompt || sm.title || '(no user prompt)';
        cells.p.classList.remove('muted');
        cells.steps.textContent = sm.steps; cells.tok.textContent = '≈ ' + tok(sm.tokens);
        if (sm.cwd && h.textContent.startsWith(p.dir)) h.textContent = sm.cwd + (isHere ? '  (this folder)' : '');
      };
      if (s.summary) fill(s.summary); else queue.push({s, fill, cells});
      if (isHere && !first) { first = row; row.classList.add('sel'); }
      sec.append(row);
    }
    box.append(sec);
  }
  if (first) first.focus({preventScroll: true});
  const work = async () => {
    while (queue.length && !doc) {
      const job = queue.shift();
      try { job.fill(await api('summary', null, {path: job.s.path})); }
      catch (e) { job.cells.p.textContent = '(could not read: ' + e.message + ')'; }
    }
  };
  work(); work(); work();
}

/* ------------------------------------------------------------------ editor */
async function openSession(path) {
  $('banners').replaceChildren();
  $('picker').replaceChildren(el('div', {class: 'empty'}, el('span', {class: 'spin'}), ' Opening session…'));
  let data;
  try { data = await api('open', {path}); } catch (e) { await showPicker(); return fail(e); }
  doc = data.doc; meta = data.meta; steps = data.steps; counters = data.counters;
  byId = {}; views = {}; cards = {}; expanded = new Set(); editing = new Set(); sugg = {}; detours = [];
  offKinds = new Set(); searchIds = null; anchor = null; errSteps = new Set(); savedAt = -1;
  for (const s of steps) byId[s.id] = s;
  history.replaceState(null, '', location.pathname + location.search + '#open=' + encodeURIComponent(path));
  $('picker').classList.add('hidden'); $('picker').replaceChildren();
  $('editor').classList.remove('hidden'); $('bar2').classList.remove('hidden');
  $('counter').classList.remove('hidden'); $('editorButtons').classList.remove('hidden'); $('back').classList.remove('hidden');
  $('title').textContent = meta.title || meta.id; $('title').classList.remove('muted');
  $('title').title = meta.path;
  $('search').value = ''; $('marker').checked = meta.marker; $('markerText').textContent = meta.trim_marker;
  if (meta.maybe_running) {
    banner('', 'This session was written to ' + Math.max(1, Math.round(meta.age)) + ' seconds ago and may still be running. ' +
      'You are looking at a snapshot: steps added after it was opened will not appear here or in the fork.');
  }

    const r = await api('suggest', {doc, full});
    sugg = {};
    for (const sg of r.suggestions) if (byId[sg.id] && !view(sg.id).dropped) sugg[sg.id] = sg;
    // a pair needs only one marker: keep it on the tool call's partner once
    for (const id of Object.keys(sugg)) { const p = partner(byId[id]); if (p && sugg[p.id] && sugg[id] && sugg[id].action === 'drop' && byId[id].kind === 'tool_use') delete sugg[id]; }
    for (const s of steps) paint(s.id);
    paintSugg();
    const n = Object.keys(sugg).length;
    $('banners').replaceChildren();
    banner(r.errors.length ? '' : 'ok', n ? n + ' suggestion' + (n === 1 ? '' : 's') + ' marked on the cards. Nothing has been changed.' : 'The model suggested no cuts.',
      r.errors.length ? el('ul', {}, ...r.errors.map((e) => el('li', {text: 'Failed: ' + e}))) : null,
      r.notes && r.notes.length ? el('div', {class: 'muted', text: r.notes.join(' ')}) : null);
    const first = Object.keys(sugg).sort((a, b) => byId[a].index - byId[b].index)[0];
    if (first) jump(first);
  } catch (e) { fail(e); }

}

  for (const d of detours) {
    for (const id of d.ids) cards[id].classList.add('in-detour');
    const a = byId[d.ids[0]], b = byId[d.ids[d.ids.length - 1]], anc = d.anchor && byId[d.anchor];
    const ta = el('textarea', {spellcheck: 'false'}); ta.value = d.note;
    ta.addEventListener('input', () => { d.note = ta.value; });
    const mv = (which, dir, text, title) => el('button', {text, title, onclick: () => moveDetour(d, which, dir)});
    d.el = el('div', {class: 'detour'},
      el('h4', {text: 'Detour · steps #' + (a.index + 1) + ' to #' + (b.index + 1) + ' · ' + d.ids.length + ' steps · ≈ ' + tok(d.tokens) + ' tok'}),
      el('div', {class: 'why', text: d.reason}),
      anc ? el('label', {text: 'Accepting drops these steps and leaves this note in step #' + (anc.index + 1) + ' (' + LABEL[anc.kind] + '). Leave it empty to drop everything.'})
          : el('label', {text: 'No step in this range can carry a note, so accepting only drops the steps.'}),
      anc ? ta : null,
      anc && d.files.length ? el('div', {class: 'files', text: 'Added to the note: files changed during the detour: ' + d.files.join(', ')}) : null,
      el('div', {class: 'ctl'}, 'Start',
        mv('first', -1, '↑ earlier', 'Begin the detour one step earlier'), mv('first', 1, '↓ later', 'Begin the detour one step later'),
        'End', mv('last', -1, '↑ earlier', 'End the detour one step earlier'), mv('last', 1, '↓ later', 'End the detour one step later'),
        el('button', {text: 'Show end', onclick: () => jump(b.id)}),
        el('span', {class: 'grow'}),
        el('button', {class: 'primary', text: 'Accept', onclick: () => acceptDetour(d)}),
        el('button', {text: 'Dismiss', onclick: () => { detours = detours.filter((x) => x !== d); paintDetours(); }})));
    cards[a.id].before(d.el);
  }
}
async function moveDetour(d, which, dir) {
  // step to the next live, droppable step in that direction
  const ok = steps.filter((s) => s.group === 'live' && s.droppable && !view(s.id).dropped).map((s) => s.index);
  const cur = which === 'first' ? byId[d.ids[0]].index : byId[d.ids[d.ids.length - 1]].index;
  const next = dir < 0 ? Math.max(...ok.filter((i) => i < cur), -1) : Math.min(...ok.filter((i) => i > cur), Infinity);
  if (next < 0 || next === Infinity) return;
  const first = which === 'first' ? next : byId[d.ids[0]].index, last = which === 'last' ? next : byId[d.ids[d.ids.length - 1]].index;
  if (first > last) return;
  if (detours.some((x) => x !== d && byId[x.ids[0]].index <= last && byId[x.ids[x.ids.length - 1]].index >= first)) return;
  try {
    const r = await api('detour_range', {doc, first, last});
    if (!r.ids.length) return;
    Object.assign(d, {first: r.first, last: r.last, ids: r.ids, anchor: r.anchor, files: r.files, tokens: r.tokens});
    paintDetours();
  } catch (e) { fail(e); }
}
async function acceptDetour(d) {
  const note = d.note.trim(), keep = d.anchor && note ? d.anchor : null;
  const ops = [{op: 'drop', ids: d.ids.filter((id) => id !== keep), value: true}];
  if (keep) ops.push({op: 'edit', id: keep, text: d.tag + note + (d.files.length ? '\nFiles changed during the detour: ' + d.files.join(', ') : '')});
  detours = detours.filter((x) => x !== d);
  paintDetours();
  await op(ops.length === 1 ? ops[0] : {op: 'batch', ops});  // one undo step
}
function paintSugg() {
  const n = Object.keys(sugg).length;
  $('suggBar').classList.toggle('hidden', !n);
  $('suggCount').textContent = n + ' suggestion' + (n === 1 ? '' : 's');
}
async function acceptSugg(ids) {
  const ops = [], done = [], review = [], drops = [];
  for (const id of ids) {
    const sg = sugg[id]; if (!sg) continue;
    if (sg.action === 'drop') { drops.push(id); done.push(id); }
    else if (sg.action === 'rewrite') { ops.push({op: 'edit', id, text: sg.text}); done.push(id); }
    else if (sg.removed) { ops.push({op: 'set_removed', id, removed: sg.removed}); done.push(id); }
    else if (byId[id].kind === 'tool_result') { ops.push({op: 'keep_lines', id, head: 10, tail: 10}); done.push(id); }
    else review.push(id);
  }
  if (drops.length) ops.unshift({op: 'drop', ids: drops, value: true});
  for (const id of done) delete sugg[id];
  if (ids.length === 1) for (const id of review) delete sugg[id];
  if (ops.length) await op(ops.length === 1 ? ops[0] : {op: 'batch', ops});  // one undo step
  for (const id of done.concat(ids.length === 1 ? review : [])) paint(id);
  if (ids.length === 1 && review.length && !expanded.has(review[0])) toggleExpand(review[0]);
  paintSugg();
}
$('acceptAll').addEventListener('click', () => acceptSugg(Object.keys(sugg)));
$('dismissAll').addEventListener('click', () => { const ids = Object.keys(sugg); sugg = {}; for (const id of ids) paint(id); paintSugg(); });

setInterval(() => { api('ping').catch(() => {}); }, 60000);
const initial = location.hash.match(/^#open=(.*)$/);
if (initial) openSession(decodeURIComponent(initial[1])); else showPicker();
</script>
